function chartToggleButton(p,expanded){if(p.name===ALL_PROJECTS_SUMMARY_NAME)return `<button type="button" class="chart-toggle" data-action="all" data-project="${escapeAttr(p.name)}">${allChartsExpanded()?"隐藏全部收入趋势":"显示全部收入趋势"}</button>`;return `<button type="button" class="chart-toggle" data-action="project" data-project="${escapeAttr(p.name)}">${expanded?"隐藏单项收入趋势":"显示单项收入趋势"}</button>`}
function projectCard(p){const expanded=isChartExpanded(p.name),total=sumProject(p),dayDates=[TODAY],today=sumProject(p,dayDates),dayAvg=averageValue(p,raw.dates),weekDates=currentWeekDates(),week=sumProject(p,weekDates),weekAvg=averagePeriodValue(p,previousWeekPeerDates()),monthDates=currentMonthDates(),month=sumProject(p,monthDates),monthAvg=averagePeriodValue(p,previousMonthPeerDates());return `<article class="project-card"><div class="card-head"><div><h2 class="card-title">${escapeHtml(p.name)}${projectTrendBadge(week,weekAvg,month,monthAvg)}</h2></div><div class="card-controls">${chartToggleButton(p,expanded)}${expanded?chartControls():""}</div></div>${expanded?chartPanel(p):""}<div class="metric-row">${miniMetric(metricLabel("\u5f53\u65e5\u6536\u5165",dayDates),today,compareText(today,dayAvg,"\u65e5\u5747"))}${miniMetric(metricLabel("\u5f53\u5468\u6536\u5165",weekDates),week,compareText(week,weekAvg,weekPeerLabel()))}${miniMetric(metricLabel("\u5f53\u6708\u6536\u5165",monthDates),month,compareText(month,monthAvg,monthPeerLabel()))}${miniMetric(metricLabel("\u7d2f\u8ba1\u6536\u5165",raw.dates),total,"\u5168\u90e8\u6709\u6548\u65e5\u671f")}</div><p class="project-analysis">${projectAnalysis(p,today,dayAvg,week,weekAvg,total)}</p></article>`}
function projectAnalysis(p,today,dayAvg,week,weekAvg,total){const all=sumProjects(raw.projects),share=all?total/all*100:0,dayDelta=dayAvg?(today-dayAvg)/dayAvg*100:0,weekDelta=weekAvg?(week-weekAvg)/weekAvg*100:0;let tone="\u6574\u4f53\u8868\u73b0\u5e73\u7a33";if(dayDelta>=25&&weekDelta>=15)tone="\u5f53\u65e5\u4e0e\u672c\u5468\u540c\u6b65\u8d70\u5f3a";else if(dayDelta>=25)tone="\u5f53\u65e5\u6536\u5165\u660e\u663e\u653e\u91cf";else if(weekDelta>=15)tone="\u672c\u5468\u6536\u5165\u9ad8\u4e8e\u5e38\u6001";else if(dayDelta<=-25&&weekDelta<=-15)tone="\u77ed\u671f\u6536\u5165\u627f\u538b";else if(dayDelta<=-25)tone="\u5f53\u65e5\u6536\u5165\u504f\u5f31";else if(weekDelta<=-15)tone="\u672c\u5468\u6536\u5165\u4f4e\u4e8e\u5e38\u6001";return `${tone}\uff0c\u7d2f\u8ba1\u6536\u5165${money.format(total)}\u5143\uff0c\u5360\u5168\u90e8\u9879\u76ee${share.toFixed(1)}%\uff1b\u5f53\u65e5${formatSigned(dayDelta)}\uff0c\u672c\u5468${formatSigned(weekDelta)}\u3002`}
function miniMetric(label,value,sub){return `<div class="mini-metric"><span>${label}</span><strong>\u00a5${money.format(value)}</strong><em>${sub}</em></div>`}
function projectTrendBadge(week,weekAvg,month,monthAvg){const weekDelta=weekAvg?(week-weekAvg)/weekAvg:0,monthDelta=monthAvg?(month-monthAvg)/monthAvg:0;if(weekDelta>0&&monthDelta>0)return `<span class="title-trend title-trend-up">\u25b2</span>`;if(weekDelta<0&&monthDelta<0)return `<span class="title-trend title-trend-down">\u25bc</span>`;return `<span class="title-trend title-trend-wave">\u2248</span>`}
function metricLabel(label,dates){return `${label} \u00b7 ${dateRangeText(dates)}`}
function dateRangeText(dates){const clean=dates.filter(Boolean);if(!clean.length)return "-";const first=clean[0],last=clean[clean.length-1];return first===last?dateText(first):`${dateText(first)}-${dateText(last)}`}
function compareText(value,base,name){if(!base)return`<span class="flat">\u25cf</span> \u6682\u65e0${name}\u53ef\u6bd4`;const delta=(value-base)/base*100,cls=delta>=0?"up":"down",arrow=delta>=0?"\u25b2":"\u25bc",signed=`${delta>=0?"+":""}${delta.toFixed(1)}%`;return`<span class="${cls}">${arrow}</span> ${name} ${signed}`}
function formatSigned(v){if(!Number.isFinite(v))return "\u6682\u65e0\u53ef\u6bd4";return `${v>=0?"+":""}${v.toFixed(1)}%`}
function weekPeerLabel(){return `\u540c\u6bd4${weekScopeText()}\u5747\u503c`}
function monthPeerLabel(){return `\u540c\u6bd4\uff081~${new Date(TODAY).getDate()}\u53f7\uff09\u5747\u503c`}
function weekScopeText(){const weekday=weekdayText(new Date(TODAY).getDay());return weekday==="\u5468\u4e00"?`\uff08\u5468\u4e00\uff09`:`\uff08\u5468\u4e00~${weekday}\uff09`}
function monthScopeText(){return `\uff081~${new Date(TODAY).getDate()}\u53f7\uff09`}
function isConstantProject(p){const vals=raw.dates.map(d=>p.values[d]).filter(v=>v!==null&&Number(v)!==0);if(vals.length<5)return false;return vals.every(v=>Number(v)===Number(vals[0]))}
function averageValue(p,dates){const vals=dates.map(d=>p.values[d]).filter(v=>v!==null);return vals.length?vals.reduce((a,b)=>a+b,0)/vals.length:0}
function averageDailyTotal(projects){const vals=raw.dates.map(d=>sumProjects(projects,[d]));return vals.length?vals.reduce((a,b)=>a+b,0)/vals.length:0}
function currentWeekDates(){const today=new Date(TODAY),monday=new Date(today);monday.setDate(today.getDate()-((today.getDay()+6)%7));return dateRange(monday,today)}
function previousWeekPeerDates(){const today=new Date(TODAY),span=(today.getDay()+6)%7+1,starts=[];for(const d of raw.dates){const dt=new Date(d);if(dt<today&&dt.getDay()===1)starts.push(dt)}return starts.filter(s=>addDays(s,span-1)<today).map(s=>dateRange(s,addDays(s,span-1)).filter(d=>raw.dates.includes(d))).filter(ds=>ds.length)}
function currentMonthDates(){const today=new Date(TODAY),start=new Date(today.getFullYear(),today.getMonth(),1);return dateRange(start,today)}
function previousMonthPeerDates(){const today=new Date(TODAY),day=today.getDate(),months=[...new Set(raw.dates.map(d=>d.slice(0,7)))].filter(m=>m<TODAY.slice(0,7));return months.map(m=>{const [y,mo]=m.split("-").map(Number),endDay=Math.min(day,new Date(y,mo,0).getDate()),start=new Date(y,mo-1,1),end=new Date(y,mo-1,endDay);return dateRange(start,end).filter(d=>raw.dates.includes(d))}).filter(ds=>ds.length)}
function averagePeriodValue(p,periods){if(!periods.length)return 0;return periods.reduce((s,ds)=>s+sumProject(p,ds),0)/periods.length}
function averagePeriodTotal(projects,periods){if(!periods.length)return 0;return periods.reduce((s,ds)=>s+sumProjects(projects,ds),0)/periods.length}
function averageNumbers(values){return values.length?values.reduce((a,b)=>a+b,0)/values.length:0}
function dateRange(start,end){const out=[],d=new Date(start);while(d<=end){out.push(toIso(d));d.setDate(d.getDate()+1)}return out.filter(x=>raw.dates.includes(x))}
function addDays(date,n){const d=new Date(date);d.setDate(d.getDate()+n);return d}
function toIso(d){return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`}
function dailyChartData(p){return raw.dates.map(d=>({label:formatDate(d),tipLabel:formatDate(d),value:p.values[d]??0}))}
function weeklyChartData(p){const end=new Date(TODAY),dates=raw.dates,weeks=[];let cursor=new Date(dates[0]||TODAY);cursor.setDate(cursor.getDate()-((cursor.getDay()+6)%7));while(cursor<=end){const weekStart=new Date(cursor),weekEnd=addDays(weekStart,6),ds=dates.filter(d=>{const dt=new Date(d);return dt>=weekStart&&dt<=weekEnd});if(ds.length){weeks.push({label:`${formatDate(ds[0])}\u5468`,tipLabel:`${formatDate(ds[0])}-${formatDate(toIso(ds.map(x=>new Date(x)).sort((a,b)=>b-a)[0]))}`,value:sumProject(p,ds),scope:weekEnd>=end?weekScopeText():""})}cursor=addDays(cursor,7)}return weeks}
function monthlyChartData(p){const months=[...new Set(raw.dates.map(d=>d.slice(0,7)))];return months.map(m=>{const dates=raw.dates.filter(d=>d.startsWith(m));const [year,month]=m.split("-").map(Number);return{label:`${month}\u6708`,tipLabel:`${year}\u5e74${month}\u6708`,value:sumProject(p,dates),scope:m===TODAY.slice(0,7)?monthScopeText():""}})}
function completedWeekTotals(p){const end=new Date(TODAY),dates=raw.dates,totals=[];let cursor=new Date(dates[0]||TODAY);cursor.setDate(cursor.getDate()-((cursor.getDay()+6)%7));while(cursor<=end){const weekStart=new Date(cursor),weekEnd=addDays(weekStart,6),ds=dates.filter(d=>{const dt=new Date(d);return dt>=weekStart&&dt<=weekEnd});if(ds.length===7&&weekEnd<end)totals.push(sumProject(p,ds));cursor=addDays(cursor,7)}return totals}
function completedMonthTotals(p){const current=TODAY.slice(0,7),months=[...new Set(raw.dates.map(d=>d.slice(0,7)))].filter(m=>m<current);return months.map(m=>sumProject(p,raw.dates.filter(d=>d.startsWith(m))))}
function chartData(p){if(state.chartMode==="month")return monthlyChartData(p);if(state.chartMode==="week")return weeklyChartData(p);return dailyChartData(p)}
function chartPointGap(mode,width,rightPadding){if(mode==="day")return (width-rightPadding)/(DAILY_VISIBLE_POINTS-1);return mode==="week"?132:190}
function shouldShowPointLabel(mode,index,lastIndex){return mode!=="day"||index%2===0||index===lastIndex}
function pathLengthAtX(path,targetX,totalLength){let low=0,high=totalLength;for(let i=0;i<24;i++){const mid=(low+high)/2;if(path.getPointAtLength(mid).x<targetX)low=mid;else high=mid}return(low+high)/2}
function restartCssAnimation(node){node.style.animation="none";node.getBoundingClientRect();node.style.animation=""}
function configureVisibleCurveMotion(el){
  const svg=el.querySelector("svg"),glowPaths=[...el.querySelectorAll(".chart-curve-glow")],glowPath=glowPaths[0];
  if(!svg||!glowPath)return;
  const totalLength=glowPath.getTotalLength();
  if(!Number.isFinite(totalLength)||totalLength<=1)return;
  const viewWidth=svg.viewBox.baseVal.width||1,displayWidth=svg.getBoundingClientRect().width||viewWidth,unitsPerPixel=viewWidth/displayWidth,firstX=glowPath.getPointAtLength(0).x,lastX=glowPath.getPointAtLength(totalLength).x,startX=Math.max(firstX,el.scrollLeft*unitsPerPixel),endX=Math.min(lastX,(el.scrollLeft+el.clientWidth)*unitsPerPixel);
  if(endX<=startX)return;
  const startLength=pathLengthAtX(glowPath,startX,totalLength),endLength=pathLengthAtX(glowPath,endX,totalLength),visibleLength=endLength-startLength;
  if(visibleLength<=1)return;
  const glowLength=Math.max(24,visibleLength*.096),segmentLength=glowLength/GLOW_SEGMENTS;
  const motionDuration=Number(el.dataset.motionDuration)||5.2;
  glowPaths.forEach((path,index)=>{const positionOffset=-glowLength+(index+1)*segmentLength,progress=index/(GLOW_SEGMENTS-1),smoothProgress=progress*progress*(3-2*progress),opacity=0.1+0.9*smoothProgress;path.style.strokeDasharray=`${segmentLength} ${totalLength+glowLength}`;path.style.opacity=opacity;path.style.strokeLinecap=index===GLOW_SEGMENTS-1?"round":"butt";path.style.animationDuration=`${motionDuration}s`;path.style.setProperty("--stream-start",`${-(startLength+positionOffset)}px`);path.style.setProperty("--stream-end",`${-(endLength+positionOffset)}px`);restartCssAnimation(path)});
  const visiblePoints=[];
  el.querySelectorAll(".chart-point").forEach(point=>{point.style.animation="none";const pointX=Number(point.getAttribute("cx"));if(pointX>=startX&&pointX<=endX)visiblePoints.push({point,pointX})});
  svg.getBoundingClientRect();
  visiblePoints.forEach(({point,pointX})=>{const delay=((pointX-startX)/(endX-startX))*motionDuration;point.style.animationDuration=`${motionDuration}s`;point.style.setProperty("--pulse-delay",`${delay}s`);point.style.animation=""});
}
function bindChartScroll(el){let frame=0;el.addEventListener("scroll",()=>{cancelAnimationFrame(frame);frame=requestAnimationFrame(()=>configureVisibleCurveMotion(el))},{passive:true})}
function renderProjectChart(el){
  const name=el.dataset.project,p=[allProjectsSummary,...raw.projects].find(x=>x.name===name);
  if(!p)return;
  const motionDuration=state.chartMode==="day"?6.5:5.2;el.dataset.motionDuration=motionDuration;
  const data=chartData(p),avg=chartAverage(p,data),avgLabel=chartAverageLabel(),box=el.getBoundingClientRect(),pad={top:34,right:46,bottom:34,left:58},pointGap=chartPointGap(state.chartMode,box.width,pad.right),w=state.chartMode==="day"?Math.max(Math.floor(box.width),(data.length-1)*pointGap+pad.left+pad.right):Math.max(Math.floor(box.width),data.length*pointGap+120),h=250,max=Math.max(1,avg,...data.map(d=>d.value))*1.18,x=i=>data.length===1?(pad.left+w-pad.right)/2:pad.left+i*((w-pad.left-pad.right)/Math.max(1,data.length-1)),y=v=>h-pad.bottom-(v/max)*(h-pad.top-pad.bottom);
  const points=data.map((d,i)=>({x:x(i),y:y(d.value),datum:d,index:i}));
  const curvePath=ChartMotion.smoothPath(points);
  const areaPath=ChartMotion.areaPath(curvePath,points,h-pad.bottom);

  const avgLine=`<line class="avg-line" x1="${pad.left}" x2="${w-pad.right}" y1="${avgY}" y2="${avgY}"></line><text x="${w-pad.right-4}" y="${Math.max(12,avgY-6)}" text-anchor="end" class="avg-label">${avgLabel} ${money.format(avg)}</text>`;
  const grid=[0,.5,1].map(t=>{const yy=y(max*t);return`<line class="gridline" x1="${pad.left}" x2="${w-pad.right}" y1="${yy}" y2="${yy}"></line><text x="4" y="${yy+4}" class="bar-label">${money.format(max*t)}</text>`}).join("");
  const labels=data.map((d,i)=>shouldShowPointLabel(state.chartMode,i,data.length-1)?`<text x="${x(i)}" y="${h-8}" text-anchor="middle" class="bar-label">${d.label}</text>`:"").join("");
  const dateIncomeGuides=state.chartMode==="day"?points.filter(({index})=>shouldShowPointLabel(state.chartMode,index,points.length-1)).map(({x:px,y:py})=>`<line class="daily-date-income-guide" x1="${px}" x2="${px}" y1="${Math.min(h-20,py+6)}" y2="${h-20}"></line>`).join(""):"";
  const valueLabels=data.map((d,i)=>{const anchor=i===0?"start":i===data.length-1?"end":"middle";return`<text x="${x(i)}" y="${Math.max(12,y(d.value)-9)}" text-anchor="${anchor}" class="node-label">${money.format(d.value)}${d.scope||""}</text>`}).join("");
  const pointNodes=points.map(({x:px,y:py,datum,index})=>{const latest=index===points.length-1?" latest":"",delay=ChartMotion.pointDelay(index,points.length,motionDuration);return`<circle class="chart-point${latest}" style="--pulse-delay:${delay}s;animation-duration:${motionDuration}s" cx="${px}" cy="${py}" r="${latest?4.5:3.8}" data-tip="${escapeAttr(name)}<br>${datum.tipLabel}\uff1a${money.format(datum.value)}${datum.scope||""}"></circle>`}).join("");
  const glowNodes=Array.from({length:GLOW_SEGMENTS},(_,index)=>`<path class="chart-curve-glow" data-glow-segment="${index}" d="${curvePath}"></path>`).join("");
  el.innerHTML=`<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="${escapeAttr(name)}收入趋势"><defs><linearGradient id="${gradientId}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5aaee7" stop-opacity=".38"></stop><stop offset="55%" stop-color="#9cccf0" stop-opacity=".18"></stop><stop offset="100%" stop-color="#d9e9f7" stop-opacity=".03"></stop></linearGradient></defs><path class="chart-area-gradient" style="fill:url(#${gradientId})" d="${areaPath}"></path>${grid}${avgLine}${dateIncomeGuides}<path class="chart-curve-main" d="${curvePath}"></path>${glowNodes}${pointNodes}${valueLabels}${labels}</svg>`;
}
function chartAverage(p,data){if(state.chartMode==="week")return averageNumbers(completedWeekTotals(p));if(state.chartMode==="month")return averageNumbers(completedMonthTotals(p));return averageValue(p,raw.dates)}
function chartAverageLabel(){if(state.chartMode==="month")return "\u6708\u5747";if(state.chartMode==="week")return "\u5468\u5747";return "\u65e5\u5747"}
function weekdayText(day){return ["\u5468\u65e5","\u5468\u4e00","\u5468\u4e8c","\u5468\u4e09","\u5468\u56db","\u5468\u4e94","\u5468\u516d"][day]||"\u4eca\u65e5"}
function bindTips(root){root.querySelectorAll("[data-tip]").forEach(n=>{n.addEventListener("mousemove",e=>{tooltip.innerHTML=n.dataset.tip;tooltip.style.left=`${e.clientX}px`;tooltip.style.top=`${e.clientY}px`;tooltip.style.opacity=1});n.addEventListener("mouseleave",()=>tooltip.style.opacity=0)})}
function formatDate(iso){const d=new Date(iso);return`${d.getMonth()+1}/${d.getDate()}`}
function dateText(iso){const d=new Date(iso);return `${d.getMonth()+1}\u6708${d.getDate()}\u65e5`}
function escapeHtml(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]))}
